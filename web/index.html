<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zaino</title>
<script src="tema.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Le icone del menu: sul PC accanto al nome, sul telefono da sole nella barra in basso (style.css). -->
<svg class="icone" aria-hidden="true">
  <symbol id="i-oggi" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-agenda" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  <symbol id="i-compiti" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-orario" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-voti" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16v-7"/></symbol>
  <symbol id="i-carico" viewBox="0 0 24 24"><path d="M3 12h4l3 8 4-16 3 8h4"/></symbol>
  <symbol id="i-assenze" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 8l4 4M21 8l-4 4"/></symbol>
</svg>
<main>
  <header class="top">
    <div>
      <h1 id="titolo">Zaino</h1>
      <p class="sub" id="aggiornato">Caricamento…</p>
    </div>
    <div class="azioni">
      <label class="scegli-tema"><span class="sr">Tema</span><select id="tema" aria-label="Tema"></select></label>
      <button id="apri-profili" class="btn ghost" type="button" hidden>Profili</button>
      <button id="aggiorna" class="btn" type="button" hidden>Aggiorna</button>
    </div>
  </header>

  <div id="avviso" class="avviso" role="status" hidden></div>
  <div id="aggiornamento" class="avviso nuova-versione" role="status" hidden></div>

  <section id="profili" hidden></section>

  <div id="app" hidden>
  <nav class="tabs" role="tablist" aria-label="Sezioni">
    <button role="tab" data-tab="oggi"><svg class="ico" aria-hidden="true"><use href="#i-oggi"/></svg><span class="nome">Oggi</span></button>
    <button role="tab" data-tab="agenda"><svg class="ico" aria-hidden="true"><use href="#i-agenda"/></svg><span class="nome">Agenda</span></button>
    <button role="tab" data-tab="compiti"><svg class="ico" aria-hidden="true"><use href="#i-compiti"/></svg><span class="nome">Compiti</span></button>
    <button role="tab" data-tab="orario"><svg class="ico" aria-hidden="true"><use href="#i-orario"/></svg><span class="nome">Orario</span></button>
    <button role="tab" data-tab="voti"><svg class="ico" aria-hidden="true"><use href="#i-voti"/></svg><span class="nome">Voti</span></button>
    <button role="tab" data-tab="carico"><svg class="ico" aria-hidden="true"><use href="#i-carico"/></svg><span class="nome">Carico di lavoro</span></button>
    <button role="tab" data-tab="assenze"><svg class="ico" aria-hidden="true"><use href="#i-assenze"/></svg><span class="nome">Assenze</span></button>
  </nav>

  <section id="tab-oggi" role="tabpanel" hidden></section>
  <section id="tab-agenda" role="tabpanel" hidden></section>
  <section id="tab-compiti" role="tabpanel" hidden></section>
  <section id="tab-orario" role="tabpanel" hidden></section>
  <section id="tab-voti" role="tabpanel" hidden></section>
  <section id="tab-carico" role="tabpanel" hidden></section>
  <section id="tab-assenze" role="tabpanel" hidden></section>
  </div>
</main>
<div id="tip" class="tip" hidden></div>
<script src="punti.js"></script>
<script src="app.js"></script>
</body>
</html>
